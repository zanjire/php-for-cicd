name: Dockerize 8.4

# Builds and pushes uscf/php-docker:8.4 only. It is a separate workflow so that
# pushing a change to Dockerfile.8.4 does not rebuild (and overwrite) the 8.2 / 8.3 tags.

on:
  push:
    branches: [ main ]
    paths:
      - Dockerfile.8.4
      - deploy/**
      - .github/workflows/Build-8.4.yml
  workflow_dispatch:

concurrency:
  group: php-8.4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Build and push image 8.4
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: uscf/php-docker:8.4
          file: Dockerfile.8.4
